# Hard rule evaluation configuration
# ------------------------------------
# failure_keywords: used by MutationMatcherRule to detect failed steps.
#
# Rules are organized by scope:
#   trajectory_rules: run via HardRuleRunner.run() — keys must match _REGISTRY
#   per_step_rules: (deprecated — empty; retained for backward compat)
#
# For trajectory rules:
#   enabled: false to skip a rule entirely.
#   All other keys are passed as **kwargs to the rule's from_trajectory classmethod.

failure_keywords:
  - error
  - exception
  - failed
  - traceback
  - stderr
  - errno
  - no such file
  - permission denied
  - timeout
  - not found

trajectory_rules:
  redundancy_rate:
    enabled: true
    max_rate: 0.25

  monotonic_progress:
    enabled: true
    stagnation_threshold: 0.95
    prior_steps_window: 2

  data_dependency:
    enabled: true

  tool_sequence:
    enabled: true
    confidence_threshold: 3
    powerful_couples:
      - [create_file, write_file]
      - [read_file, str_replace]
      - [list_directory, read_file]
      - [execute_command, read_output]

  cycle_breaker:
    enabled: true
    horizon: 5

  token_efficiency:
    enabled: true
    max_growth_ratio: 2.0

  mutation_matcher:
    enabled: true

  # Rule j — Terminal State Check
  # The last non-error step must contain at least one completion keyword.
  terminal_state:
    enabled: true
    completion_keywords:
      - done
      - complete
      - completed
      - finished
      - fixed
      - resolved
      - success
      - successfully
      - all tests pass
      - implemented
      - applied
      - submit
      - submitted

  tool_param_count:
    enabled: true
    description: "Tool must receive exactly the observed number of parameters"

  tool_param_type:
    enabled: true
    description: "Each parameter must have the expected Python type"

  # Rule k — Tool Result Output Type Validation
  # Detects structured types (JSON, XML, Python, number) in tool_result outputs
  # and asserts they remain valid.  No configurable parameters.
  tool_result_type:
    enabled: true

  # Rule l — LLM Response Format / Schema Conformance
  # When the preceding user message requests JSON / YAML / XML output, the
  # llm_response must parse cleanly for that format.
  llm_response_format:
    enabled: true

  # Rule m — LLM Response Grounding / Referential Integrity
  # Entity references (file paths, #IDs, commit SHAs, backtick identifiers) in
  # llm_response steps must appear in the N most-recent tool_result outputs.
  llm_grounding:
    enabled: true
    context_window: 10

  # Rule n — Token Budget Enforcement
  # Per-step token budget: flag steps whose token_count exceeds observed + pct.
  token_budget:
    enabled: true
    token_budget_pct: 20.0

  # Rule o — Latency Budget Enforcement
  # Per-step latency budget: flag steps whose latency_ms exceeds observed + pct.
  latency_budget:
    enabled: true
    latency_budget_pct: 50.0

  # Rule p — Tool Output Utilization
  # Verifies tool_result outputs are consumed by a downstream step.
  tool_output_utilization:
    enabled: true

  # Rule q — LLM Response Utilization
  # Verifies llm_response outputs are consumed by a downstream step.
  llm_response_utilization:
    enabled: true

per_step_rules: {}

